services:
  smartspend:
    build: .
    container_name: smartspend-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=smartspend_secret_jwt_key_2026_super_secure
      # Configure your real-time email SMTP credentials below:
      - SMTP_SERVICE=gmail
      - SMTP_USER=your_email@gmail.com
      - SMTP_PASS=your_gmail_app_password
      - SMTP_FROM="SmartSpend AI" <your_email@gmail.com>
      # Optional: Google Gemini API key
      - GEMINI_API_KEY=
    volumes:
      - smartspend_data:/app/server

volumes:
  smartspend_data:
    driver: local
